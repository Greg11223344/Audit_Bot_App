# Render "Blueprint" -- https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then in Render click "New +" -> "Blueprint" and point it at
# the repo. Render reads this file and provisions the web service + disk; the database is an
# external Supabase Postgres instance, not managed by Render (see DATABASE_URL below).
services:
  - type: web
    name: audit-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: AUDIT_BOT_ENVIRONMENT
        value: production
      - key: AUDIT_BOT_SECRET_KEY
        generateValue: true # Render generates a random secret; you never see/type it.
      - key: AUDIT_BOT_ADMIN_EMAIL
        sync: false # set in the Render dashboard after the blueprint is created
      - key: AUDIT_BOT_ADMIN_PASSWORD
        sync: false # set in the Render dashboard -- required before the first deploy will boot
      - key: DATABASE_URL
        sync: false # set in the Render dashboard to your Supabase connection string -- never
        # committed to this file/repo. Format:
        # postgresql://postgres:<password>@db.<project-ref>.supabase.co:5432/postgres
        # Use the direct connection (port 5432), not the pgbouncer pooler (6543): this app keeps
        # a persistent SQLAlchemy connection pool, which is what the direct port is meant for.
      - key: AUDIT_BOT_STORAGE_DIR
        value: /data/storage
    disk:
      name: audit-bot-storage
      mountPath: /data
      sizeGB: 1 # uploaded photos + PDF reports; resize later if the team's usage grows
