<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f3e46">
  <title>Audit_bot</title>
  <link rel="manifest" href="/app/manifest.json">
  <link rel="icon" href="/app/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/app/icons/icon-192.png">
  <link rel="stylesheet" href="/app/css/style.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/app/js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/app/sw.js").catch((e) => console.warn("SW registration failed", e));
      });
    }
  </script>
</body>
</html>
